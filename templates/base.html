<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}MyVoice Voting System - A professional online voting platform{% endblock %}">
    <title>{% block title %}MyVoice Voting System{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('theme_css') }}">
    {% block extra_css %}{% endblock %}

    <link rel="icon" type="image/png" href="{% if system_settings and system_settings.school_logo %}{{ url_for('static', filename='uploads/' + system_settings.school_logo) }}{% else %}{{ url_for('static', filename='images/favicon.png') }}{% endif %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
